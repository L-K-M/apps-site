server {
    listen 80;
    server_name _;
    root /site/public;
    index index.html;

    add_header X-Content-Type-Options nosniff always;

    location / {
        try_files $uri $uri/ =404;
    }

    # Hide the generator's ownership marker, including on direct requests.
    location ~ /\. {
        deny all;
    }
}

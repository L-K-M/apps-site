name: CI
on:
  push:
    branches: [main]
  pull_request:

# CI only needs to read the checkout.
permissions:
  contents: read

# Cancel superseded PR checks, preserving the result of each main commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    # Bound hung installs, tests and browser startup.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: make check
      # The uploaded site must carry the notices of its third-party fonts, icons and images.
      - name: Verify bundled notices
        working-directory: dist/assets
        run: |
          for f in fonts/OFL-pirata-one.txt fonts/OFL-instrument-sans.txt fonts/c64-keyboard-NOTICE.txt \
            icons/LICENSE-bootstrap.txt media-credits.txt; do
            test -s "$f"
          done
          grep -q 'SIL Open Font License' fonts/OFL-pirata-one.txt
          grep -q 'SIL Open Font License' fonts/OFL-instrument-sans.txt
          grep -q 'The Bootstrap Authors' icons/LICENSE-bootstrap.txt
          grep -q 'Eric Li' media-credits.txt
          grep -q 'Radhi Fadlillah' media-credits.txt
          grep -q 'softdorothy' media-credits.txt
      - uses: actions/upload-artifact@v7
        with:
          name: static-site
          path: dist

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: docker compose up -d --build
      - run: curl --fail --retry 10 --retry-delay 2 --retry-connrefused http://localhost:8080/
      - if: always()
        run: docker compose logs && docker compose down --volumes

name: CI
on:
  push:
    branches: [main]
  pull_request:

# CI only needs to read the checkout.
permissions:
  contents: read

# Cancel superseded PR checks, preserving the result of each main commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    # Bound hung installs, tests and browser startup.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: make check
      - uses: actions/upload-artifact@v7
        with:
          name: static-site
          path: dist

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build
      - run: curl --fail --retry 10 --retry-delay 2 --retry-connrefused http://localhost:8080/
      - if: always()
        run: docker compose logs && docker compose down --volumes

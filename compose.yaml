services:
  generator:
    image: apps-site-generator:local
    build: .
    pull_policy: build
    command: ["node", "bin/apps-site.mjs", "build", "--config", "/config/site.json"]
    volumes:
      # Defaults to the sibling repos; only repository metadata is read.
      - ${REPOSITORIES_DIR:-..}:/repositories:ro
      # Override this file to change the title, sources, or canonical URL.
      - ${SITE_CONFIG:-./docker/site.json}:/config/site.json:ro
      - ./catalogue:/app/catalogue:ro
      - generated:/site
    restart: "no"

  site:
    image: nginx:1.30-alpine
    depends_on:
      generator:
        condition: service_completed_successfully
    ports:
      # Set APPS_SITE_PORT to change the published HTTP port.
      - ${APPS_SITE_PORT:-8080}:80
    volumes:
      - generated:/site:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

volumes:
  generated:
